<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KRYZON · Decisões claras, fluxos inteligentes</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    /* v2: dark, high-contrast, Rocketseat-style */
    --navy: #1a1d24;
    --navy-deep: #0d0f14;
    --navy-ink: #050608;
    --teal: #4FBFC0;
    --teal-soft: #6FD3D4;
    --teal-glow: #7FE8E9;
    --cream: #FFFFFF;
    --paper: #F4F4F5;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --muted: #A8B0C2;
    --muted-2: #6B7280;
  }

  html { scroll-behavior: smooth; scroll-padding-top: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--navy-ink);
    color: var(--cream);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(79,191,192,0.18), transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(79,191,192,0.08), transparent 60%),
      var(--navy-ink);
  }

  ::selection { background: var(--teal); color: var(--navy-ink); }

  .serif { font-family: 'Quicksand', 'Nunito', sans-serif; font-weight: 500; }
  .mono { font-family: 'Geist Mono', monospace; }
  .display { font-family: 'Quicksand', 'Nunito', sans-serif; font-weight: 600; letter-spacing: -0.03em; }

  /* grid background pattern */
  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 100% 80% at 50% 30%, #000 30%, transparent 80%);
    z-index: 0;
  }

  /* container */
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .wrap { padding: 0 20px; } }

  /* utility — fade in on scroll */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .9s cubic-bezier(.2,.7,.3,1), transform .9s cubic-bezier(.2,.7,.3,1); }
  .reveal.in { opacity: 1; transform: none; }

  /* shimmer pill */
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  @keyframes marquee {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @keyframes float-up {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  @keyframes scan {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100%); }
  }
  @keyframes shine {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes grid-pan {
    from { background-position: 0 0; }
    to { background-position: 80px 80px; }
  }
  @keyframes draw-line {
    from { stroke-dashoffset: 1000; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* button styles */
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 22px;
    border-radius: 999px;
    font-size: 14px; font-weight: 500;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.7,.3,1);
    letter-spacing: -0.01em;
  }
  .btn-primary {
    background: var(--teal); color: var(--navy-ink);
    box-shadow: 0 0 0 0 rgba(79,191,192,0.4);
  }
  .btn-primary:hover {
    background: var(--teal-glow); color: var(--navy-ink);
    box-shadow: 0 0 0 8px rgba(79,191,192,0.18);
    transform: translateY(-1px);
  }
  .btn-ghost {
    color: var(--cream);
    border-color: var(--line-strong);
    background: rgba(255,255,255,0.02);
  }
  .btn-ghost:hover {
    border-color: var(--teal);
    color: var(--teal);
    background: rgba(79,191,192,0.06);
  }

  /* nav */
  nav.top {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 50;
    height: 72px;
    backdrop-filter: blur(16px);
    background: var(--nav-bg, rgba(14,20,40,0.6));
    border-bottom: 1px solid var(--line);
    transition: height .3s, background .3s;
  }
  nav.top.scrolled { height: 60px; background: var(--nav-bg-scrolled, rgba(14,20,40,0.85)); }
  nav.top .inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 100%;
  }
  nav.top .links { display: flex; gap: 4px; }
  nav.top .links a {
    color: var(--muted); text-decoration: none; font-size: 13px;
    padding: 8px 14px; border-radius: 999px;
    transition: all .2s;
  }
  nav.top .links a:hover { color: var(--cream); background: var(--line); }
  @media (max-width: 820px) { nav.top .links { display: none; } }

  .logo {
    display: flex; align-items: center;
    text-decoration: none;
    height: 100%;
    position: relative;
  }
  .logo-img {
    height: 110px; width: auto;
    display: block;
    transition: height .3s, transform .3s;
    /* allow overflow beyond nav height */
    margin-top: 4px;
  }
  nav.top.scrolled .logo-img { height: 84px; }
  .logo:hover .logo-img { transform: scale(1.03); }
  footer .logo-img { height: 120px; margin-top: 0; }
  @media (max-width: 720px) {
    .logo-img { height: 80px; }
    nav.top.scrolled .logo-img { height: 64px; }
    footer .logo-img { height: 88px; }
  }
  .logo:hover .logo-mark {
    transform: rotate(-6deg) scale(1.05);
  }
  .logo .wordmark {
    color: var(--teal);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .logo .wordmark .accent { color: var(--teal); }

  /* HERO — v2 centered editorial */
  section.hero {
    position: relative;
    min-height: 100vh;
    padding: 80px 0 40px;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }
  @media (max-height: 800px) { section.hero { padding: 72px 0 32px; } }
  @media (max-width: 980px) {
    section.hero { padding: 84px 0 48px; min-height: auto; }
  }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(79,191,192,0.08);
    border: 1px solid rgba(79,191,192,0.2);
    font-size: 12px; letter-spacing: 0.06em;
    color: var(--teal);
    text-transform: uppercase;
    font-family: 'Geist Mono', monospace;
  }
  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal);
    animation: pulse-dot 1.6s ease-in-out infinite;
    box-shadow: 0 0 8px var(--teal);
  }

  h1.hero-title {
    font-family: 'Quicksand', 'Nunito', sans-serif;
    font-weight: 700;
    font-size: clamp(36px, 5.2vw, 72px);
    line-height: 1.05;
    letter-spacing: -0.04em;
    margin: 24px 0 32px;
    text-wrap: balance;
  }
  h1.hero-title em {
    font-style: normal;
    font-weight: 700;
    color: var(--teal);
    background: linear-gradient(120deg, var(--teal) 0%, var(--teal-glow) 50%, var(--teal) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }

  p.hero-sub {
    font-size: clamp(15px, 1.4vw, 18px);
    color: var(--muted);
    max-width: 540px;
    line-height: 1.5;
    margin-bottom: 28px;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 80px;
    align-items: center;
  }
  @media (max-width: 980px) {
    .hero-grid { grid-template-columns: 1fr; gap: 48px; }
  }

  .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }

  /* live dashboard mock */
  .dashboard {
    position: relative;
    background: linear-gradient(160deg, rgba(46,61,98,0.6) 0%, rgba(27,37,64,0.4) 100%);
    border: 1px solid var(--line-strong);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: blur(20px);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .dashboard::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 20px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(79,191,192,0.4), transparent 50%, rgba(79,191,192,0.2));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }
  .dashboard-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .dashboard-head .title { font-size: 13px; font-weight: 500; }
  .dashboard-head .live {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--teal);
    font-family: 'Geist Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .dashboard-head .live .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal);
    animation: pulse-dot 1.4s ease-in-out infinite;
  }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat {
    padding: 14px;
    background: rgba(255,255,255,0.02);
    border-radius: 12px;
    border: 1px solid var(--line);
  }
  .stat .label {
    font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.08em; font-family: 'Geist Mono', monospace;
    margin-bottom: 8px;
  }
  .stat .value {
    font-family: 'Quicksand', 'Nunito', sans-serif;
    font-weight: 700;
    letter-spacing: -0.03em;
    font-size: 32px; line-height: 1;
    color: var(--cream);
  }
  .stat .delta {
    font-size: 11px; color: var(--teal);
    font-family: 'Geist Mono', monospace;
    margin-top: 4px;
  }

  /* sparkline */
  .spark { width: 100%; height: 80px; margin-top: 8px; }
  .spark path.line {
    fill: none; stroke: var(--teal); stroke-width: 1.5;
    stroke-dasharray: 1000; stroke-dashoffset: 1000;
    animation: draw-line 2.5s ease-out forwards 0.5s;
  }
  .spark path.area {
    fill: url(#sparkGradient);
    opacity: 0;
    animation: fade-in 1s ease-out forwards 2.5s;
  }
  @keyframes fade-in { to { opacity: 1; } }

  /* SECTION title */
  .section-tag {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--teal);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 24px;
  }
  .section-tag::before {
    content: ''; width: 24px; height: 1px; background: var(--teal);
  }

  h2.section-title {
    font-family: 'Quicksand', 'Nunito', sans-serif;
    font-weight: 600;
    font-size: clamp(30px, 4vw, 52px);
    line-height: 1.05;
    letter-spacing: -0.04em;
    margin-bottom: 20px;
    text-wrap: balance;
  }
  h2.section-title em { color: var(--teal); font-style: normal; font-weight: 700; }

  /* SECTIONS — fit-to-viewport with compact rhythm */
  section {
    position: relative;
    padding: 88px 0 64px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  section > .wrap { width: 100%; }
  @media (max-height: 800px) {
    section { padding: 80px 0 40px; }
  }
  @media (max-width: 980px) {
    section { min-height: auto; padding: 72px 0 56px; }
  }

  /* PILLARS */
  .pillars-intro {
    display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;
    margin-bottom: 32px;
  }
  @media (max-width: 820px) { .pillars-intro { grid-template-columns: 1fr; gap: 24px; } }
  .pillars-intro p {
    color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 460px;
  }
  .pillars-intro svg { width: 160px !important; height: 160px !important; }
  @media (max-width: 820px) {
    .cases-header { grid-template-columns: 1fr !important; gap: 24px !important; }
    .cases-header svg { width: 140px !important; height: 140px !important; }
  }

  .pillars {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 24px;
    overflow: hidden;
  }
  @media (max-width: 980px) { .pillars { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .pillars { grid-template-columns: 1fr; } }

  .pillar {
    position: relative;
    padding: 24px 22px 22px;
    background: var(--navy-ink);
    transition: background .4s;
    cursor: default;
    overflow: hidden;
    min-height: 200px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .pillar:hover { background: rgba(46,61,98,0.4); }
  .pillar:hover .pillar-letter {
    color: var(--teal);
    transform: translateY(-6px) scale(1.04);
    text-shadow: 0 0 40px rgba(79,191,192,0.4);
  }
  .pillar:hover .pillar-glow { opacity: 1; }
  .pillar:hover .pillar-arrow { transform: translateX(6px); color: var(--teal); }

  .pillar-letter {
    font-family: 'Quicksand', 'Nunito', sans-serif;
    font-weight: 700;
    letter-spacing: -0.05em;
    font-size: 72px; line-height: 0.9;
    color: rgba(245,241,234,0.18);
    transition: all .5s cubic-bezier(.2,.7,.3,1);
    background: linear-gradient(180deg, rgba(245,241,234,0.32) 0%, rgba(245,241,234,0.08) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .pillar:hover .pillar-letter {
    background: linear-gradient(180deg, var(--teal-glow) 0%, var(--teal) 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .pillar-name {
    font-size: 22px; font-weight: 600;
    margin-bottom: 10px; letter-spacing: -0.02em;
    font-family: 'Quicksand', 'Nunito', sans-serif;
  }
  .pillar-desc {
    font-size: 14px; color: var(--muted); line-height: 1.55;
  }
  .pillar-num {
    position: absolute; top: 28px; right: 32px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.1em;
  }
  .pillar-arrow {
    position: absolute; bottom: 28px; right: 32px;
    color: var(--muted);
    transition: all .3s;
    display: inline-flex;
  }

  .pillar-glow {
    position: absolute;
    top: -50px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(79,191,192,0.3), transparent 70%);
    opacity: 0;
    transition: opacity .5s;
    pointer-events: none;
  }

  .pillar-name {
    font-size: 22px; font-weight: 500;
    margin-bottom: 10px; letter-spacing: -0.01em;
  }
  .pillar-desc {
    font-size: 14px; color: var(--muted); line-height: 1.55;
  }
  .pillar-num {
    position: absolute; top: 24px; right: 28px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.08em;
  }

  /* FLOW DIAGRAM */
  .flow-section {
    background: linear-gradient(180deg, var(--navy-ink) 0%, var(--navy-deep) 50%, var(--navy-ink) 100%);
  }

  /* CASES — slightly deeper bg for rhythm */
  #casos {
    background: var(--navy-deep);
  }
  #casos::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(79,191,192,0.04), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(79,191,192,0.03), transparent 40%);
    pointer-events: none;
  }
  #casos > * { position: relative; z-index: 1; }

  /* Section dividers — soft hairline between sections */
  section + section::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: min(1200px, 90%); height: 1px;
    background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
    pointer-events: none;
  }
  .flow-section + section::before,
  section + .flow-section::before,
  section + .cta-section::before { display: none; }

  .flow-stage {
    position: relative;
    margin-top: 60px;
    padding: 48px 32px;
    border: 1px solid var(--line-strong);
    border-radius: 24px;
    background:
      radial-gradient(ellipse at center, rgba(79,191,192,0.08), transparent 60%),
      rgba(27,37,64,0.4);
    overflow: hidden;
  }
  .flow-stage::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(79,191,192,0.08) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(79,191,192,0.08) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: grid-pan 40s linear infinite;
    pointer-events: none;
  }

  /* MARQUEE */
  /* MARQUEE — full-bleed band between sections */
  .marquee {
    overflow: hidden;
    padding: 36px 0;
    margin: 100px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--navy-deep);
    mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent);
  }
  @media (max-width: 980px) { .marquee { margin: 60px 0; padding: 24px 0; } }
  .marquee-track {
    display: flex; gap: 80px; width: max-content;
    animation: marquee 40s linear infinite;
  }
  .marquee-item {
    font-family: 'Quicksand', 'Nunito', sans-serif;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-size: 38px; color: var(--muted);
    white-space: nowrap;
    display: flex; align-items: center; gap: 80px;
  }
  .marquee-item::after {
    content: '◆'; color: var(--teal); font-size: 14px;
  }

  /* CASES */
  .cases-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    margin-top: 60px;
  }
  @media (max-width: 820px) { .cases-grid { grid-template-columns: 1fr; } }

  .case {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 36px;
    overflow: hidden;
    background: linear-gradient(160deg, rgba(46,61,98,0.3), rgba(27,37,64,0.1));
    transition: all .4s;
  }
  .case:hover {
    border-color: var(--teal);
    transform: translateY(-4px);
    background: linear-gradient(160deg, rgba(46,61,98,0.5), rgba(27,37,64,0.2));
  }
  .case .industry {
    font-family: 'Geist Mono', monospace;
    font-size: 11px; color: var(--teal);
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 16px;
  }
  .case .headline {
    font-family: 'Quicksand', 'Nunito', sans-serif;
    font-weight: 600;
    letter-spacing: -0.025em;
    font-size: 28px; line-height: 1.18;
    margin-bottom: 24px;
    text-wrap: balance;
  }
  .case .metrics {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }
  .case .metrics .v {
    font-family: 'Quicksand', 'Nunito', sans-serif;
    font-weight: 700;
    letter-spacing: -0.03em;
    font-size: 44px; line-height: 1; color: var(--teal);
  }
  .case .metrics .l {
    font-size: 12px; color: var(--muted);
    margin-top: 6px;
  }

  /* CTA */
  .cta-section {
    padding: 100px 0;
    text-align: center;
    background:
      radial-gradient(ellipse at center, rgba(79,191,192,0.12), transparent 60%),
      var(--navy-ink);
    border-top: 1px solid var(--line);
  }
  .cta-eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 12px; color: var(--teal);
    letter-spacing: 0.14em; text-transform: uppercase;
    margin-bottom: 24px;
  }
  .cta-title {
    font-family: 'Quicksand', 'Nunito', sans-serif;
    font-weight: 600;
    font-size: clamp(48px, 8vw, 96px);
    line-height: 1.04; letter-spacing: -0.035em;
    margin-bottom: 24px; text-wrap: balance;
  }
  .cta-title em { font-style: normal; font-weight: 700; color: var(--teal); }
  .cta-sub {
    font-size: 18px; color: var(--muted);
    max-width: 540px; margin: 0 auto 40px;
    line-height: 1.5;
  }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--line);
    padding: 60px 0 32px;
    background: var(--navy-ink);
  }
  .footer-grid {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px;
    margin-bottom: 60px;
  }
  @media (max-width: 820px) { .footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; } }
  footer h4 {
    font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted);
    margin-bottom: 16px; font-weight: 500;
    font-family: 'Geist Mono', monospace;
  }
  footer ul { list-style: none; }
  footer li { margin-bottom: 10px; }
  footer a {
    color: var(--cream); text-decoration: none; font-size: 14px;
    transition: color .2s;
  }
  footer a:hover { color: var(--teal); }

  .footer-bottom {
    padding-top: 32px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted);
    font-family: 'Geist Mono', monospace;
  }

  /* big wordmark */
  .big-mark {
    font-family: 'Quicksand', 'Nunito', sans-serif;
    font-weight: 700;
    font-size: clamp(80px, 18vw, 280px);
    line-height: 0.85;
    letter-spacing: -0.06em;
    background: linear-gradient(180deg, rgba(79,191,192,0.18), transparent 70%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 32px;
    user-select: none;
  }

  /* terminal-ish text */
  .cursor {
    display: inline-block; width: 0.5em; height: 1em;
    background: var(--teal); margin-left: 4px;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }

  /* floating chips */
  .chip {
    position: absolute;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    padding: 8px 12px;
    background: rgba(27,37,64,0.85);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    backdrop-filter: blur(8px);
    color: var(--cream);
    display: flex; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .chip .ind {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 6px var(--teal);
  }

  /* Tweaks panel injected by tweaks-panel.jsx */
  #tweaks-root { z-index: 100; }
</style>
